# Render Blueprint — FoodLab Academy
# Deploy: Dashboard → New → Blueprint → connect this repo
# Note: Render free Postgres was discontinued; use a paid Postgres plan
#       or an external free Postgres (Neon, Supabase, etc.) and set DATABASE_URL.

services:
  - type: web
    name: foodlab-academy
    runtime: docker
    plan: free
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: FoodLab Academy
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        sync: false
      - key: APP_KEY
        sync: false
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: foodlab-db
          property: connectionString
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: SEED_ON_DEPLOY
        value: "false"
      - key: APP_LOCALE
        value: fr
      - key: APP_FALLBACK_LOCALE
        value: fr
      - key: AUTO_VERIFY_EMAIL
        value: "true"
      - key: MAIL_MAILER
        value: log
      - key: MAIL_ENCRYPTION
        value: ""
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: MAIL_FROM_NAME
        value: FoodLab Academy
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: CALENDLY_URL
        sync: false
      - key: META_PIXEL_ID
        sync: false
      - key: GTM_ID
        sync: false
      - key: WHATSAPP_URL
        sync: false
      - key: WHATSAPP_NUMBER
        sync: false

databases:
  - name: foodlab-db
    plan: basic_256mb
    databaseName: foodlab
    user: foodlab
